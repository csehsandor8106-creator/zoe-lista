<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Zoé Lista – okos, offline használható bevásárlólista." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Zoé Lista</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Zoé Lista</h1>
        <p class="subtitle">Gyors, okos bevásárlólista</p>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Téma váltása">◐</button>
    </header>

    <section class="composer" aria-label="Új termék hozzáadása">
      <form id="addForm" autocomplete="off">
        <label class="sr-only" for="itemInput">Termék</label>
        <input id="itemInput" inputmode="text" placeholder="pl. 1 kg marhahús • Chio • 2 tej • Milka 599 Ft" />
        <button class="add-btn" type="submit">Hozzáadás</button>
      </form>
      <div class="quick-help">Mennyiség jöhet előre vagy hátra. Saját ár: <b>Milka 599 Ft</b>.</div>
    </section>

    <section class="toolbar" aria-label="Lista műveletek">
      <button id="hideDoneBtn" class="soft-btn" type="button">✓ Kipipáltak elrejtése</button>
      <button id="clearDoneBtn" class="soft-btn" type="button">Kipipáltak törlése</button>
    </section>

    <section id="listRoot" class="list-root" aria-live="polite"></section>

    <footer class="summary">
      <div>
        <div id="countText" class="summary-small">0 tétel</div>
        <div id="estimateText" class="summary-note">A becsült árak tájékoztató jellegűek.</div>
      </div>
      <div id="totalText" class="summary-total">0 Ft</div>
    </footer>
  </main>

  <dialog id="editDialog">
    <form id="editForm" method="dialog" class="edit-card">
      <div class="dialog-head">
        <h2>Tétel szerkesztése</h2>
        <button id="closeEditBtn" class="icon-btn" type="button" aria-label="Bezárás">✕</button>
      </div>
      <input type="hidden" id="editId" />
      <label>Név<input id="editName" /></label>
      <label>Kategória<select id="editCategory"></select></label>
      <label>Ikon<input id="editIcon" maxlength="4" /></label>
      <label>Egység<select id="editUnit"><option>db</option><option>kg</option><option>l</option><option>csomag</option><option>doboz</option><option>üveg</option></select></label>
      <label>Egységár (Ft)<input id="editPrice" type="number" min="0" step="1" inputmode="numeric" /></label>
      <label class="remember-row"><input id="learnRule" type="checkbox" checked /> Ezt a felismerést jegyezze meg</label>
      <div class="dialog-actions">
        <button id="cancelEditBtn" class="soft-btn" type="button">Mégse</button>
        <button class="add-btn" type="submit">Mentés</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
